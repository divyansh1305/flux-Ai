# Off-site backup: every day, download the newest database backup from the live site, encrypt it with
# BACKUP_PASSPHRASE, and keep it as a workflow artifact for 30 days. Encrypted, because artifacts of a public repo can
# be downloaded by anyone signed in to GitHub. Without the passphrase the file is useless.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions → New repository secret):
#   FLUX_URL           https://kitna.pythonanywhere.com   (or https://fluxai.pythonanywhere.com)
#   BACKUP_TOKEN       the same value as BACKUP_TOKEN in the site's .env
#   BACKUP_PASSPHRASE  a long random password; keep a copy somewhere safe (password manager)
# and in the site's .env: BACKUP_TOKEN=... and BACKUP_DIR=/home/<you>/flux-ai/instance/backups, then Reload.
#
# Restore: download the artifact → gpg -d flux-backup.db.gpg > flux.db (asks for the passphrase)
name: off-site backup
on:
  schedule:
    - cron: "17 4 * * *"   # 09:47 IST daily, an hour after the site's 03:15 UTC daily task makes a fresh backup
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check it's set up
        id: check
        env:
          FLUX_URL: ${{ secrets.FLUX_URL }}
        run: |
          if [ -z "$FLUX_URL" ]; then
            echo "Off-site backup isn't set up (no FLUX_URL secret). Skipping. On PythonAnywhere the daily task keeps backups in instance/backups."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download newest backup
        if: steps.check.outputs.ok == 'true'
        env:
          FLUX_URL: ${{ secrets.FLUX_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          curl -fsS --retry 3 --max-time 300 -H "Authorization: Bearer $BACKUP_TOKEN" \
            "$FLUX_URL/admin/backup/latest" -o flux-backup.db
          head -c 15 flux-backup.db | grep -q "SQLite format 3"
      - name: Encrypt
        if: steps.check.outputs.ok == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o flux-backup.db.gpg flux-backup.db
          rm flux-backup.db
      - if: steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flux-backup-${{ github.run_number }}
          path: flux-backup.db.gpg
          retention-days: 30
