# Builds the Kitna Android companion app on GitHub's servers and publishes it as a download:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/kitna-android.apk
# Signed with the Kitna release key when the repo has these Actions secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them it falls back to a debug-signed build. Either way it installs from a link (sideload).
name: android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME is set).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build (signed release if the key is set up, else debug)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KITNA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KITNA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KITNA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kitna.jks"
            export KITNA_KEYSTORE="$RUNNER_TEMP/kitna.jks"
            gradle -p android assembleRelease --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk kitna-android.apk
            rm -f "$RUNNER_TEMP/kitna.jks"
            echo "Signed release build."
          else
            gradle -p android assembleDebug --no-daemon
            cp android/app/build/outputs/apk/debug/app-debug.apk kitna-android.apk
            echo "No signing key set up: debug build."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kitna-android
          path: kitna-android.apk
      - name: Publish as the "android-latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Kitna Android app" \
            --notes "Install on Android 8+. Open the file, allow installing from your browser, then open Kitna Companion." --latest=false
          gh release upload android-latest kitna-android.apk --clobber
