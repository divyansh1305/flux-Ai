# Builds the Flux Android companion app on GitHub's servers and publishes it as a download:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/flux-android.apk
# It is a debug-signed build, which installs from a link (sideload). For Google Play, add a release key later.
name: android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        run: gradle -p android assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk flux-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: flux-android
          path: flux-android.apk
      - name: Publish as the "android-latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Flux Android app" \
            --notes "Install on Android 8+. Open the file, allow installing from your browser, then open Flux Companion." --latest=false
          gh release upload android-latest flux-android.apk --clobber
