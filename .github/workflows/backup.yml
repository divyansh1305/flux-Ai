# Off-site backup: every day, download the newest database backup from your Render app,
# encrypt it, and keep it as a private workflow artifact for 30 days.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions → New secret):
#   FLUX_URL           https://<your-app>.onrender.com
#   BACKUP_TOKEN       same value as BACKUP_TOKEN in Render (Render → Environment → reveal)
#   BACKUP_PASSPHRASE  a long random password you keep in your password manager
#
# Restore: download the artifact → gpg -d flux-backup.db.gpg > flux.db (asks for the passphrase)
name: off-site backup
on:
  schedule:
    - cron: "17 21 * * *"   # 02:47 IST daily
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check it's set up
        id: check
        env:
          FLUX_URL: ${{ secrets.FLUX_URL }}
        run: |
          if [ -z "$FLUX_URL" ]; then
            echo "Off-site backup isn't set up (no FLUX_URL secret). Skipping. On PythonAnywhere the daily task keeps backups in instance/backups."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download newest backup
        if: steps.check.outputs.ok == 'true'
        env:
          FLUX_URL: ${{ secrets.FLUX_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          curl -fsS --retry 3 --max-time 300 -H "Authorization: Bearer $BACKUP_TOKEN" \
            "$FLUX_URL/admin/backup/latest" -o flux-backup.db
          head -c 15 flux-backup.db | grep -q "SQLite format 3"
      - name: Encrypt
        if: steps.check.outputs.ok == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o flux-backup.db.gpg flux-backup.db
          rm flux-backup.db
      - if: steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flux-backup-${{ github.run_number }}
          path: flux-backup.db.gpg
          retention-days: 30
